<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EE4D2D" />
    <title>Sem internet — Eletrônica Store</title>
    <style>
      :root {
        --brand: #ee4d2d;
        --brand-dark: #d73211;
        --page: #f5f5f5;
        --surface: #fff;
        --line: #e5e5e5;
        --ink: #222;
        --ink-soft: #757575;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--page);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        max-width: 420px;
        width: 100%;
        padding: 32px 24px;
        text-align: center;
      }
      .icon {
        color: var(--brand);
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0 0 12px;
        font-size: 14px;
        color: var(--ink-soft);
      }
      .stats {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin: 16px 0 24px;
      }
      .stat {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 12px 8px;
      }
      .stat strong {
        display: block;
        font-size: 22px;
        color: var(--brand);
      }
      .stat span {
        font-size: 12px;
        color: var(--ink-soft);
      }
      .actions {
        display: grid;
        gap: 8px;
      }
      a,
      button {
        display: block;
        width: 100%;
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        background: var(--brand);
        color: #fff;
      }
      .primary:hover {
        background: var(--brand-dark);
      }
      .secondary {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg
        class="icon"
        width="72"
        height="72"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden
      >
        <path d="M2 8.5a15.9 15.9 0 0 1 8-2.3M22 8.5a15.9 15.9 0 0 0-2.3-1.3M5.8 5.8a13 13 0 0 1 3.6-2M18.2 5.8a13 13 0 0 0-2-.9" />
        <path d="M5.5 12a11 11 0 0 1 5-1.6M18.5 12a11 11 0 0 0-1.5-.5" />
        <path d="M8.5 15.5a7 7 0 0 1 3-.9M15.5 15.5a7 7 0 0 0-.7-.2" />
        <path d="M12 19h.01" />
        <path d="m3 3 18 18" />
      </svg>
      <h1>Você está sem internet</h1>
      <p>
        Não foi possível conectar à internet. O que já está no seu aparelho
        continua disponível:
      </p>
      <div class="stats">
        <div class="stat">
          <strong id="cart-count">0</strong>
          <span>itens no carrinho</span>
        </div>
        <div class="stat">
          <strong id="fav-count">0</strong>
          <span>favoritos salvos</span>
        </div>
      </div>
      <div class="actions">
        <a class="primary" href="/">Continuar offline</a>
        <button class="secondary" type="button" onclick="location.reload()">
          Tentar novamente
        </button>
      </div>
      <p class="hint">
        Carrinho, favoritos e pedidos ficam guardados neste navegador e
        continuam acessíveis sem rede.
      </p>
    </main>
    <script>
      function readKey(key) {
        try {
          var raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }
      function setCount(id, value) {
        document.getElementById(id).textContent = String(value);
      }
      var cart = readKey("electronica:cart");
      if (cart && !Array.isArray(cart) && Array.isArray(cart.items)) {
        cart = cart.items;
      }
      setCount(
        "cart-count",
        Array.isArray(cart)
          ? cart.reduce(function (sum, item) {
              return sum + (Number(item && item.qty) || 1);
            }, 0)
          : 0
      );
      var favs = readKey("electronica:favorites");
      setCount("fav-count", Array.isArray(favs) ? favs.length : 0);
    </script>
  </body>
</html>
